name: Release

# Pushing a tag v<qemu version>-<n> (for example v11.1.3-1) builds and tests
# the binary package from scratch and attaches it, with the corresponding
# source archive, to a draft GitHub release. Review the draft and publish it.
# <n> counts releases of the same QEMU version (other components, patches).
#
# With the signing secrets set (docs/packaging.md), the package is signed with
# a Developer ID and notarized; without them it is signed ad hoc.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Check tag
        run: |
          source versions.env
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^${QEMU_REF#v}-[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the pinned QEMU; expected v${QEMU_REF#v}-<n>"
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >>"$GITHUB_ENV"

      - name: Set up signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::warning::No signing secrets; the release is signed ad hoc and not notarized."
            exit 0
          fi
          if [ -z "$NOTARY_KEY_P8" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is set but the NOTARY_* secrets are incomplete"
            exit 1
          fi

          # A throwaway keychain that codesign can use without a prompt.
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$kc" |
            sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 contains no Developer ID Application identity"
            exit 1
          fi
          printf '%s\n' "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - uses: ./.github/actions/setup-build-env

      - name: Fetch, build, test and package
        env:
          CI_SOURCE_ARCHIVE: 1
        run: scripts/ci.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/common.sh
          pkg="$PACKAGE_NAME-$PACKAGE_VERSION"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$pkg-macos-arm64.tar.xz"
          {
            echo "QEMU with OpenGL acceleration for Linux guests on Apple Silicon Macs."
            echo
            sed -n '/^## Contents/,/^License texts/p' "build/package/$pkg/README.md" | sed '$d'
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -LO $url"
            echo "tar -xJf $pkg-macos-arm64.tar.xz"
            echo "$pkg/bin/qemu-system-aarch64 --version"
            echo '```'
            echo
            echo "See README.md in the archive for an example. \`$pkg-source.tar\` is the corresponding source."
          } >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$pkg" --notes-file "$RUNNER_TEMP/notes.md" dist/*
