name: Release

# Builds and tests the binary package from scratch, signs and notarizes it,
# publishes it with the source archive as GitHub release v<qemu version>-<n>,
# then points the Homebrew tap at it (homebrew-tap.yml).
#
# Start it from the Actions tab (Run workflow, on main); <n> counts releases of
# the same QEMU version and is picked automatically. Pushing a tag
# v<qemu version>-<n> releases that commit instead.
#
# With the signing secrets set (docs/packaging.md), the package is signed with
# a Developer ID and notarized; without them it is signed ad hoc.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Stop at a draft release; publishing it by hand then updates the tap
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: macos-15
    timeout-minutes: 300
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v5

      - name: Pick the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source versions.env
          qemu="${QEMU_REF#v}"
          re="v${qemu//./[.]}-"  # v11[.]1[.]3-
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^${re}[0-9]+$ ]]; then
              echo "::error::tag $tag doesn't match the pinned QEMU; expected v$qemu-<n>"
              exit 1
            fi
          else
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::releases are made from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            # Drafts have no tag yet, so look at releases as well as tags.
            n="$( { git ls-remote --tags origin "refs/tags/v$qemu-*" | sed 's#.*refs/tags/##'
                    gh release list --limit 1000 --json tagName --jq '.[].tagName'; } |
                  sed -n "s/^$re\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)"
            tag="v$qemu-$(( ${n:-0} + 1 ))"
          fi
          echo "Releasing $tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "PACKAGE_VERSION=${tag#v}" >>"$GITHUB_ENV"

      - name: Set up signing
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::warning::No signing secrets; the release is signed ad hoc and not notarized."
            exit 0
          fi
          if [ -z "$NOTARY_KEY_P8" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER_ID" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is set but the NOTARY_* secrets are incomplete"
            exit 1
          fi

          # A throwaway keychain that codesign can use without a prompt.
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(uuidgen)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$CERTIFICATE_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db

          identity="$(security find-identity -v -p codesigning "$kc" |
            sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 contains no Developer ID Application identity"
            exit 1
          fi
          printf '%s\n' "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          {
            echo "SIGN_IDENTITY=$identity"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER_ID"
          } >>"$GITHUB_ENV"

      - uses: ./.github/actions/setup-build-env

      - name: Fetch, build, test and package
        env:
          CI_SOURCE_ARCHIVE: 1
        run: scripts/ci.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          if-no-files-found: ignore

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          source scripts/common.sh
          pkg="$PACKAGE_NAME-$PACKAGE_VERSION"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$pkg-macos-arm64.tar.xz"
          tap="$(echo "$GITHUB_REPOSITORY_OWNER" | tr "[:upper:]" "[:lower:]")/tap"
          {
            echo "QEMU with OpenGL acceleration for Linux guests on Apple Silicon Macs."
            echo
            sed -n '/^## Contents/,/^License texts/p' "build/package/$pkg/README.md" | sed '$d'
            echo "## Install"
            echo
            echo "With Homebrew (replaces Homebrew's \`qemu\`; \`brew unlink qemu\` first if you have it):"
            echo
            echo '```sh'
            echo "brew install $tap/qemu-gl"
            echo '```'
            echo
            echo "Or unpack the archive anywhere:"
            echo
            echo '```sh'
            echo "curl -LO $url"
            echo "tar -xJf $pkg-macos-arm64.tar.xz"
            echo "$pkg/bin/qemu-system-aarch64 --version"
            echo '```'
            echo
            echo "See README.md in the archive for an example. \`$pkg-source.tar\` is the corresponding source."
          } >"$RUNNER_TEMP/notes.md"
          # A draft until every asset is uploaded; it gets its tag when published.
          args=(--draft --title "$pkg" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" "${args[@]}" dist/*

      - name: Publish release
        id: publish
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          echo "published=true" >>"$GITHUB_OUTPUT"

  # A release published by this workflow's token doesn't trigger other
  # workflows, so call the tap update directly.
  tap:
    name: Update Homebrew tap
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
